<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var Trace = null, Layout = null;

function send(type, data) {
  try {
    var msg = { isStreamlitMessage: true, type: type };
    if (data) for (var k in data) msg[k] = data[k];
    window.parent.postMessage(msg, '*');
  } catch(e) {}
}

function parentHeight() {
  try { return window.parent.innerHeight; } catch(e) {}
  return window.innerHeight;
}

function renderPlot() {
  var el = document.getElementById('root');
  if (el && window.Plotly && Trace) {
    window.Plotly.react(el, [Trace], Layout || {}, { responsive: true });
  }
}

window.addEventListener('message', function(e) {
  if (e.data.type === 'streamlit:render') {
    var a = e.data.args;
    if (!a) a = e.data.data && e.data.data.args;
    if (a) {
      Trace = a.trace;
      Layout = a.layout;
      renderPlot();
    }
  }
});

window.addEventListener('resize', function() {
  send('streamlit:setFrameHeight', { height: parentHeight() });
});

send('streamlit:componentReady', { apiVersion: 1 });
send('streamlit:setFrameHeight', { height: parentHeight() });
</script>
</body>
</html>
